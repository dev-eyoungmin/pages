<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말씀매일</title>
<meta name="description" content="매일 5분, 말씀과 함께 — 듀오링고 스타일의 성경 학습 앱">
<style>
  :root {
    --bg: #FAF8F4;
    --card: #FFFFFF;
    --ink: #1F1A12;
    --muted: #6B5E50;
    --amber: #F59E0B;
    --amber-soft: #FEF3C7;
    --border: #ECE4D6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 640px; margin: 0 auto; padding: 96px 20px; text-align: center; }
  .logo {
    width: 88px; height: 88px;
    margin: 0 auto 24px;
    border-radius: 24px;
    background: var(--amber);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 40px; font-weight: 700;
    box-shadow: 0 8px 24px rgba(245, 158, 11, 0.25);
  }
  h1 { font-size: 36px; margin: 0 0 8px; letter-spacing: -0.02em; }
  .tagline { color: var(--muted); font-size: 17px; margin: 0 0 48px; }
  .links {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    max-width: 480px; margin: 0 auto;
  }
  @media (max-width: 480px) {
    .links { grid-template-columns: 1fr; }
  }
  .link-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    text-decoration: none;
    color: var(--ink);
    transition: border-color .15s ease, transform .15s ease;
    display: block;
  }
  .link-card:hover {
    border-color: var(--amber);
    transform: translateY(-2px);
  }
  .link-title { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
  .link-desc { color: var(--muted); font-size: 14px; }
  .contact {
    margin-top: 56px;
    padding-top: 32px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 14px;
  }
  .contact a { color: var(--amber); text-decoration: none; }
  .contact a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <div class="logo">말</div>
  <h1>말씀매일</h1>
  <p class="tagline">매일 5분, 말씀과 함께</p>

  <nav class="links">
    <a class="link-card" href="./privacy.html">
      <div class="link-title">개인정보처리방침</div>
      <div class="link-desc">데이터 수집 및 이용 안내</div>
    </a>
    <a class="link-card" href="./terms.html">
      <div class="link-title">이용약관</div>
      <div class="link-desc">서비스 이용 조건</div>
    </a>
  </nav>

  <div class="contact">
    문의: <a href="mailto:be.onn.corp@gmail.com">be.onn.corp@gmail.com</a>
  </div>
</main>
</body>
</html>
